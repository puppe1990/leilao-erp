<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Pix Eletro mark C: 3×3 pixel grid, PIX period bottom-right -->
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#000000"/>
    <g fill="none" stroke="#ffffff" stroke-width="10">
      <rect x="112" y="112" width="80" height="80" rx="16"/>
      <rect x="216" y="112" width="80" height="80" rx="16"/>
      <rect x="320" y="112" width="80" height="80" rx="16"/>
      <rect x="112" y="216" width="80" height="80" rx="16"/>
      <rect x="216" y="216" width="80" height="80" rx="16"/>
      <rect x="320" y="216" width="80" height="80" rx="16"/>
      <rect x="112" y="320" width="80" height="80" rx="16"/>
      <rect x="216" y="320" width="80" height="80" rx="16"/>
    </g>
    <rect x="320" y="320" width="80" height="80" rx="16" fill="#25d366"/>
  </g>
</svg>
